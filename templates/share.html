<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical Wisdom</title>
<meta property="og:title" content="A piece of practical wisdom">
<meta property="og:description" content="{{ content }}">
<meta property="og:type" content="article">
{% if image_url %}<meta property="og:image" content="{{ image_url }}">
<meta name="twitter:card" content="summary_large_image">
{% else %}<meta name="twitter:card" content="summary">
{% endif %}
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a1022; color: #e7eaf3; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    max-width: 560px; background: #1b2747; border: 1px solid #26304e;
    border-radius: 14px; padding: 32px 34px; box-shadow: 0 14px 36px rgba(0,0,0,0.55);
  }
  .brand { font-family: Georgia, serif; font-weight: 600; font-size: 1rem; margin-bottom: 20px; }
  .brand .p { color: #e5b64a; } .brand .w { color: #f2eee3; }
  .pic { display: block; width: 100%; height: auto; border-radius: 10px; margin-bottom: 20px; }
  .tip { font-size: 1.35rem; line-height: 1.5; font-weight: 500; }
  .anecdote { margin-top: 14px; font-size: 0.92rem; line-height: 1.6; color: #a2abc2;
    border-left: 3px solid #5a8a2a; padding-left: 12px; }
  a.open {
    display: inline-block; margin-top: 26px; background: #e5b64a; color: #2a2008;
    text-decoration: none; font-weight: 600; padding: 10px 20px; border-radius: 8px;
  }
  a.open:hover { background: #f4d279; }
  .sub { margin-top: 10px; font-size: 0.78rem; color: #8f99b3; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="p">Practical</span> <span class="w">Wisdom</span></div>
    {% if image_url %}<img class="pic" src="{{ image_url }}" alt="">{% endif %}
    <div class="tip">{{ content }}</div>
    {% if anecdote %}<div class="anecdote">{{ anecdote }}</div>{% endif %}
    <a class="open" href="/?tip={{ tip_id }}">Explore this tip in the app →</a>
    <div class="sub">A library of short, practical wisdom — explore, save, and live by it.</div>
  </div>
</body>
</html>
